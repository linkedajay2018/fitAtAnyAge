{% extends "base.html" %}
{% block title %}{{ _('Forgot Password') }} — {{ site_name }}{% endblock %}
{% block content %}
<h1>🔑 {{ _('Forgot Your Password?') }}</h1>
<p class="page-lead">{{ _("Enter your email and we'll send you a link to reset it.") }}</p>

<form class="contact-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">{{ _('Email') }}</label>
    <input type="email" id="email" name="email" required autofocus>

    <button type="submit">{{ _('Send Reset Link') }}</button>
</form>
<p class="muted">
    <a href="{{ url_for('login') }}">{{ _('Back to log in') }}</a>
</p>
{% endblock %}
