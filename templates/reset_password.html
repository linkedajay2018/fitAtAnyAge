{% extends "base.html" %}
{% block title %}{{ _('Reset Password') }} — {{ site_name }}{% endblock %}
{% block content %}
<h1>🔑 {{ _('Choose a New Password') }}</h1>

<form class="contact-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">{{ _('New Password') }}</label>
    <input type="password" id="password" name="password" minlength="8" required autofocus>
    <p class="muted">{{ _('At least 8 characters.') }}</p>

    <button type="submit">{{ _('Reset Password') }}</button>
</form>
{% endblock %}
