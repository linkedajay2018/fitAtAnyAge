services:
  web:
    build: .
    ports:
      - "5050:5050"
    env_file:
      - path: .env
        required: false
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    volumes:
      - ./instance:/app/instance
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318"   # OTLP HTTP receiver
